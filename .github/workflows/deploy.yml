name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

    - name: Build & Push Docker image
      run: |
        docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tripweaver-repo/tripweaver:latest .
        docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tripweaver-repo/tripweaver:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy tripweaver-backend \
          --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tripweaver-repo/tripweaver:latest \
          --platform managed \
          --region asia-south1 \
          --allow-unauthenticated
